<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VOYD - 匿名フレンドSNS</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg-void: #07090e;
      --bg-card: #111522;
      --bg-card-light: #182032;
      --border-void: #1f273d;
      --accent: #00f2fe;
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --neon-pink: #ff007f;
      --text-main: #f8fafc;
      --text-muted: #8492a6;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-void);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-void);
      position: relative;
      box-shadow: 0 0 60px rgba(0,0,0,0.85);
      overflow: hidden;
    }

    header {
      height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-void);
      background: rgba(17, 21, 34, 0.94);
      backdrop-filter: blur(12px);
      z-index: 30;
      flex-shrink: 0;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      background: var(--accent-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
    }
    .badge-anon {
      font-size: 10px;
      background: #1c2438;
      color: #94a3b8;
      padding: 2px 7px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.06);
    }

    #announcement-bar {
      display: none;
      background: linear-gradient(90deg, #ff007f 0%, #7928ca 100%);
      color: #ffffff;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.5px;
      animation: bannerSlide 0.3s ease;
      z-index: 25;
      flex-shrink: 0;
    }
    @keyframes bannerSlide {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .view-screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .view-screen.active {
      display: flex;
    }

    #story-bar {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: rgba(12, 16, 26, 0.7);
      border-bottom: 1px solid var(--border-void);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    #story-bar::-webkit-scrollbar { display: none; }
    .story-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .story-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 2px;
      background: var(--accent-grad);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-ring.seen {
      background: #334155;
    }
    .story-avatar-inner {
      width: 100%;
      height: 100%;
      background: #090d16;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .story-label {
      font-size: 9px;
      color: #94a3b8;
      max-width: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .feed-scroll {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .feed-scroll::-webkit-scrollbar { display: none; }

    .feed-card {
      height: 100%;
      width: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      background: #080b12;
      border-bottom: 1px solid var(--border-void);
    }
    .feed-media-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #070a10;
    }
    .feed-media-wrap img, .feed-media-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .feed-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 22%, transparent 68%, rgba(0,0,0,0.88) 100%);
      pointer-events: none;
    }
    .feed-text-card {
      padding: 28px 24px;
      text-align: center;
      max-width: 88%;
      font-size: 16px;
      line-height: 1.65;
      color: #f8fafc;
      background: linear-gradient(145deg, rgba(26, 33, 53, 0.7), rgba(12, 16, 26, 0.9));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      word-break: break-word;
      user-select: text;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .feed-actions {
      position: absolute;
      right: 14px;
      bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 10;
    }
    .action-btn {
      background: rgba(14, 18, 28, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease, background 0.15s;
    }
    .action-btn:active { transform: scale(0.85); }
    .action-btn.liked { color: var(--neon-pink); border-color: var(--neon-pink); }
    .action-btn.saved { color: var(--accent); border-color: var(--accent); }
    .action-label {
      font-size: 10px;
      font-weight: 700;
      margin-top: 1px;
      color: #cbd5e1;
    }

    .reaction-picker {
      position: absolute;
      right: 56px;
      bottom: 120px;
      background: rgba(14, 19, 32, 0.95);
      border: 1px solid var(--border-void);
      border-radius: 30px;
      padding: 6px 12px;
      display: none;
      gap: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      z-index: 25;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .reaction-picker.open { display: flex; }
    .reaction-emoji-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .reaction-emoji-btn:active { transform: scale(1.3); }

    .feed-header-info {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .feed-author-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      backdrop-filter: blur(8px);
    }
    .feed-bottom-info {
      position: relative;
      z-index: 5;
      max-width: 80%;
      margin-bottom: 6px;
    }
    .feed-caption {
      font-size: 13px;
      line-height: 1.45;
      color: #f1f5f9;
      user-select: text;
      margin-bottom: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .feed-tag {
      font-size: 11px;
      color: var(--accent);
      font-family: monospace;
    }

    nav {
      height: 60px;
      background: #0d121e;
      border-top: 1px solid var(--border-void);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 30;
      flex-shrink: 0;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      gap: 3px;
      height: 100%;
      transition: color 0.15s;
    }
    .nav-item svg { width: 22px; height: 22px; fill: currentColor; }
    .nav-item span { font-size: 10px; font-weight: 600; }
    .nav-item.active { color: var(--accent); }
    
    .nav-post-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-grad);
      color: #07090e;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0,242,254,0.4);
      transition: transform 0.15s;
      margin: 0 auto;
    }
    .nav-post-btn:active { transform: scale(0.9); }
    .nav-post-btn svg { width: 22px; height: 22px; stroke: #07090e; stroke-width: 3; fill: none; }

    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-void);
      border-radius: 16px;
      padding: 18px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: var(--accent-grad);
      color: #07090e;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
    
    .btn-secondary {
      width: 100%;
      padding: 11px;
      background: #172033;
      color: #cbd5e1;
      border: 1px solid var(--border-void);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-secondary:active { background: #1e2b45; }

    .input-box {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--border-void);
      color: #f1f5f9;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus { border-color: var(--accent); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: #0e1320;
      border-top: 1px solid var(--border-void);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      animation: sheetUp 0.25s ease-out;
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-sheet-center {
      margin: auto 16px;
      border-radius: 20px;
      border: 1px solid var(--border-void);
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-void);
      padding-bottom: 10px;
    }
    .modal-title { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .modal-close {
      background: none;
      border: none;
      color: #64748b;
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
    }

    #custom-confirm-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(8px);
      z-index: 250;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #custom-confirm-modal.open { display: flex; }
    .confirm-box {
      width: 100%;
      max-width: 320px;
      background: #111625;
      border: 1px solid var(--border-void);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: center;
      animation: popIn 0.2s ease;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(17, 22, 36, 0.96);
      border: 1px solid var(--accent);
      color: #f1f5f9;
      font-size: 12px;
      padding: 9px 20px;
      border-radius: 30px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 300;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,242,254,0.3);
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* 空状態メッセージ */
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      gap: 12px;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-void);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    
    <!-- 運営アナウンスバナー -->
    <div id="announcement-bar"></div>

    <!-- ヘッダー -->
    <header>
      <div class="logo-area">
        <!-- ロゴ5回タップで管理者ゲート起動 -->
        <span class="logo" id="btn-logo">VOYD</span>
        <span class="badge-anon">ANONYMOUS</span>
      </div>
      <div>
        <button class="action-btn" style="width:34px;height:34px;" onclick="App.openInviteView()">
          <svg style="width:16px;height:16px;fill:none;stroke:#00f2fe;stroke-width:2.5;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        </button>
      </div>
    </header>

    <!-- メインコンテンツ画面群 -->
    <main>
      
      <!-- 1. ホームフィード -->
      <div id="view-home" class="view-screen active">
        <!-- 24時間ストーリーバー -->
        <div id="story-bar">
          <div class="story-bubble" onclick="App.openCreateStoryModal()">
            <div class="story-ring" style="background:#1e293b;">
              <div class="story-avatar-inner" style="color:var(--accent);">+</div>
            </div>
            <span class="story-label">ストーリー</span>
          </div>
          <div id="story-items-container" style="display:flex; gap:12px;"></div>
        </div>

        <!-- 縦スワイプフィード -->
        <div id="feed-container" class="feed-scroll">
          <div class="empty-state" id="feed-empty">
            <div class="empty-icon">🕶️</div>
            <div style="font-size: 14px; font-weight: 700; color: #f1f5f9;">投稿がまだありません</div>
            <div style="font-size: 11px; max-width: 250px; line-height: 1.6; color:#94a3b8;">
              下の「＋」ボタンから、動画・画像・テキストを完全に匿名で投稿できます。
            </div>
          </div>
        </div>
      </div>

      <!-- 2. 友達 (招待・QR) -->
      <div id="view-friends" class="view-screen" style="overflow-y:auto; padding:16px; gap:16px;">
        <div class="card-box" style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <div style="font-size: 15px; font-weight: 700; color: #f8fafc;">安全な招待制コネクト</div>
          <div style="font-size: 11px; color: var(--text-muted); line-height: 1.6;">
            電話番号・連絡先・現在地は一切取得しません。<br>
            QRコードや招待コードを使って安全に友達を追加できます。
          </div>
          
          <div id="qr-wrapper" style="background:#ffffff; padding:12px; border-radius:14px; margin: 4px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
            <!-- 純粋SVG QRコード表示領域 (外部CDN完全不要) -->
            <svg id="qr-svg" width="140" height="140" viewBox="0 0 140 140"></svg>
          </div>

          <div style="display:flex; justify-content:space-between; width:100%; background:#090d16; padding:10px 14px; border-radius:10px; border:1px solid var(--border-void); align-items:center;">
            <span style="font-size: 11px; color: var(--text-muted);">あなたの招待コード:</span>
            <span id="label-invite-code" style="font-family:monospace; font-weight:700; font-size:14px; color:var(--accent);">------</span>
          </div>

          <button class="btn-secondary" onclick="App.copyInviteCode()">招待リンクをコピー</button>
        </div>

        <!-- 友達のコードを入力 -->
        <div class="card-box" style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 13px; font-weight: 700; color: #f1f5f9;">友達のコードを入力して追加</div>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="input-friend-code" placeholder="招待コードを入力" class="input-box" style="font-family:monospace; text-transform:uppercase;">
            <button class="btn-primary" style="width: 80px;" onclick="App.addFriend()">追加</button>
          </div>
        </div>

        <!-- 友達一覧 -->
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 12px; font-weight: 600; color: var(--text-muted); padding-left: 4px;">
            友達リスト (<span id="count-friends">0</span>)
          </div>
          <div id="friends-list" style="display: flex; flex-direction: column; gap: 8px;">
            <div style="text-align: center; padding: 24px; font-size: 11px; color: #475569;">まだ友達がいません</div>
          </div>
        </div>
      </div>

      <!-- 3. メッセージ (DM) -->
      <div id="view-messages" class="view-screen" style="overflow-y:auto; padding:16px;">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9;">匿名ダイレクトメッセージ</div>
        <div id="dm-list" style="display: flex; flex-direction: column; gap: 8px;">
          <div class="empty-state" style="height: 320px;">
            <div class="empty-icon">💬</div>
            <div style="font-size: 13px; color: #64748b; font-weight:600;">メッセージはまだありません</div>
            <div style="font-size: 11px; color: #475569;">友達リストから直接メッセージを開始できます。</div>
          </div>
        </div>
      </div>

      <!-- 4. 保存一覧 (ブックマーク) -->
      <div id="view-saved" class="view-screen" style="overflow-y:auto; padding:16px;">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #f1f5f9;">保存した投稿</div>
        <div id="saved-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div style="grid-column: span 2; text-align: center; padding: 40px 0; font-size: 12px; color: #475569;">
            保存された投稿はありません
          </div>
        </div>
      </div>

    </main>

    <!-- 下部ナビゲーション -->
    <nav>
      <button class="nav-item active" onclick="App.switchTab('home')" id="tab-home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="nav-item" onclick="App.switchTab('friends')" id="tab-friends">
        <svg viewBox="0 0 24 24"><path d="M16 11c
